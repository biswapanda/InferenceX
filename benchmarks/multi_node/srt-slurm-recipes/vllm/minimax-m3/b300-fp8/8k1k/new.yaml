# Strict-improvement B300 sweep points only.
# These are the new B300 points that sit above both the interpolated
# SemiAnalysis PR-1863 and MI355x Atom FP4 Pareto curves.
base:
  model:
    path: "MiniMaxAI/MiniMax-M3-MXFP8"
    container: "vllm/vllm-openai:minimax-m3-0618-x86_64-cu130"
    precision: fp8
  dynamo:
    install: true
    version: 1.3.0.dev20260614
  frontend:
    type: dynamo
    enable_multiple_frontends: false
  resources:
    gpu_type: b300
    gpus_per_node: 8
    prefill_nodes: 1
    prefill_workers: 1
    gpus_per_prefill: 2
  backend:
    type: vllm
    connector: null
    prefill_environment:
      VLLM_FLOAT32_MATMUL_PRECISION: high
      UCX_TLS: cuda_copy,rc
    decode_environment:
      VLLM_FLOAT32_MATMUL_PRECISION: high
      UCX_TLS: cuda_copy,rc
    vllm_config:
      prefill:
        tensor-parallel-size: 1
        data-parallel-size: 2
        data-parallel-rpc-port: 13345
        enable-expert-parallel: true
        trust-remote-code: true
        no-enable-prefix-caching: true
        kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
        attention-config: '{"backend": "FLASHINFER", "use_trtllm_attention": true, "indexer_kv_dtype": "fp8"}'
        kv-cache-dtype: fp8
        block-size: 128
        gpu-memory-utilization: 0.90
        max-model-len: 9472
        language-model-only: true
        stream-interval: 32
        max-cudagraph-capture-size: 2048
        max-num-batched-tokens: 16384
      decode:
        enable-expert-parallel: true
        trust-remote-code: true
        no-enable-prefix-caching: true
        kv-transfer-config: '{"kv_connector": "NixlConnector", "kv_role": "kv_both"}'
        attention-config: '{"backend": "FLASHINFER", "use_trtllm_attention": true, "indexer_kv_dtype": "fp8"}'
        kv-cache-dtype: fp8
        block-size: 128
        gpu-memory-utilization: 0.90
        max-model-len: 9472
        language-model-only: true
        stream-interval: 32
        max-cudagraph-capture-size: 4096
        max-num-batched-tokens: 16384
  health_check:
    max_attempts: 360
    interval_seconds: 10
  benchmark:
    type: sa-bench
    isl: 8192
    osl: 1024
    req_rate: inf

zip_override_strict_optimal:
  name:
  # row 1: job 24858 c1024
  - minimax-m3-vllm-disagg-b300-2p1d-fp8-dep2-tep4-8k1k-strict
  # row 2: job 24861 c4096
  - minimax-m3-vllm-disagg-b300-4p2d-fp8-dep2-tep4-8k1k-strict
  # row 3: job 24859 c256
  - minimax-m3-vllm-disagg-b300-3p7d-fp8-dep2-tep4-8k1k-strict
  # rows 4,5,6,8: jobs 25012 c128/c64 and 24864 c32/c16
  - minimax-m3-vllm-disagg-b300-1p4d-fp8-dep2-tep4-8k1k-strict
  # row 7: job 24862 c16
  - minimax-m3-vllm-disagg-b300-1p2d-fp8-dep2-tep4-8k1k-strict
  # row 9: job 24860 c4
  - minimax-m3-vllm-disagg-b300-1p4d-fp8-dep2-tep8-8k1k-strict
  resources:
    prefill_workers: [2, 4, 3, 1, 1, 1]
    decode_workers: [1, 2, 7, 4, 2, 4]
    decode_nodes: [1, 1, 4, 2, 1, 4]
    gpus_per_decode: [4, 4, 4, 4, 4, 8]
  backend:
    vllm_config:
      decode:
        tensor-parallel-size: [4, 4, 4, 4, 4, 8]
        max-num-seqs: [512, 512, 512, 512, 512, 1024]
  benchmark:
    concurrencies:
    - "1024"
    - "4096"
    - "256"
    - "16x32x64x128"
    - "16"
    - "4"
